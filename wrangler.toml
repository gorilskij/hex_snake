# The web build at gorilskij.com/games/hexsnake/: a Worker with static assets
# (web/dist, staged by web/cf-build.sh under games/hexsnake/) on a route in
# front of the site's Worker. Deployed by Workers Builds: `pub-website` -> prod
# (`npx wrangler deploy`), `test-website` -> test (`npx wrangler deploy --env test`).
name = "hex-snake"
main = "web/worker.js"
compatibility_date = "2026-10-01"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "gorilskij.com/games/hexsnake", zone_name = "gorilskij.com" },
  { pattern = "gorilskij.com/games/hexsnake/*", zone_name = "gorilskij.com" },
]

[assets]
directory = "./web/dist"
html_handling = "auto-trailing-slash"

# `name`, `routes` and `workers_dev`/`preview_urls` do not inherit into an env.
[env.test]
name = "hex-snake-test"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "test.gorilskij.com/games/hexsnake", zone_name = "gorilskij.com" },
  { pattern = "test.gorilskij.com/games/hexsnake/*", zone_name = "gorilskij.com" },
]
