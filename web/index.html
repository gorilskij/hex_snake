<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Hex Snake</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <script src="mq_js_bundle.js"></script>
    <script>
        // Keep the canvas focused so keyboard events reach the game.
        // (wrapped in an IIFE: the bundle already declares a global `canvas`)
        (function () {
            const cnv = document.getElementById("glcanvas");
            window.addEventListener("load", () => cnv.focus());
            cnv.addEventListener("click", () => cnv.focus());
        })();
        load("hex_snake.wasm");
    </script>
</body>
</html>
