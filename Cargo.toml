[package]
name = "hex-snake"
version = "0.1.0"
authors = ["gorilskij <43991400@users.noreply.github.com>"]
edition = "2024"

[dependencies]
anyhow = "1"
macroquad = "0.4"
lyon_geom = "~1.0"
lyon_path = "1.0"
lyon_tessellation = "1.0"
rand = "0.10"
# a custom backend (selected in .cargo/config.toml) lets getrandom work on
# wasm32-unknown-unknown, where there is no default one, without pulling in
# wasm-bindgen, which would clash with macroquad's own JS loader. On native, the
# OS backend is still used.
getrandom = "0.4"
itertools = "0.15"
derive_more = { version = "2.1", features = ["add", "add_assign", "mul"] }
num-integer = "~0.1"
hsl = "0.1.1"
ezing = "~0.2"
enum-rotate = "0.1.1"
num-traits = "0.2.19"
enum-map-lite = "0.2.0"

[profile.release]
debug = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
quad-storage-sys = "0.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories = "6.0.0"
