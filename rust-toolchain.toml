[toolchain]
# Nightly: the crate itself needs no nightly feature any more, but rustfmt.toml
# uses nightly-only options. Not pinned to a date (see docs/backlog.md).
# `targets` makes rustup auto-install the wasm target on first build — important
# for the Cloudflare Workers builder, which starts from a clean toolchain.
channel = "nightly"
targets = ["wasm32-unknown-unknown"]
